services:
  valkey:
    image: valkey/valkey:9-alpine
    container_name: ${COMPOSE_PREFIX:-takumipay}-valkey
    restart: unless-stopped
    ports:
      - "${VALKEY_BIND:-0.0.0.0}:${VALKEY_HOST_PORT:-6379}:6379"
    command: valkey-server --requirepass ${VALKEY_PASSWORD}
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "-a", "${VALKEY_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  valkey_data:

# After deploying, use these in your API:
# VALKEY_HOST=<SERVER_IP or valkey.yourdomain.com>
# VALKEY_PORT=6379
# VALKEY_PASSWORD=<your-password>
