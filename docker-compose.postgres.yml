services:
  postgres:
    image: timescale/timescaledb-ha:pg18
    container_name: ${COMPOSE_PREFIX:-takumipay}-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_BIND:-0.0.0.0}:${POSTGRES_HOST_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-takumipay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-takumipay}
    volumes:
      - postgres_data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-takumipay} -d ${POSTGRES_DB:-takumipay}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

# After deploying, your DATABASE_URL will be:
# postgresql://<POSTGRES_USER>:<POSTGRES_PASSWORD>@<SERVER_IP>:5432/<POSTGRES_DB>
# Example: postgresql://takumipay:your-password@db.yourdomain.com:5432/takumipay
